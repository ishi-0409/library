name: Deploy to AWS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy Frontend to S3 & Invalidate CloudFront
        run: |
          S3_BUCKET="library-frontend-de4njeoj"
          CF_DIST_ID="E2YZ3BGG2EI1JE"

          echo "Deploying frontend to S3 bucket: $S3_BUCKET"
          aws s3 sync frontend/dist s3://$S3_BUCKET --delete

          echo "Invalidating CloudFront cache..."
          aws cloudfront create-invalidation --distribution-id $CF_DIST_ID --paths "/*"

      - name: Package and Deploy Backend to Lambda
        run: |
          cd backend/package
          zip -r ../../lambda.zip .
          cd ../..
          aws lambda update-function-code --function-name library-api --zip-file fileb://lambda.zip
