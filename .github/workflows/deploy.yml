name: Deploy to AWS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy Infrastructure & Lambda (Terraform)
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Deploy Frontend to S3 & Invalidate CloudFront
        run: |
          S3_BUCKET=$(cd terraform && terraform output -raw s3_bucket_name)
          CF_DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[0].DomainName=='${S3_BUCKET}.s3-website-ap-northeast-1.amazonaws.com'].Id" --output text)
          
          echo "Deploying to S3 bucket: $S3_BUCKET"
          aws s3 sync frontend/dist s3://$S3_BUCKET --delete

          if [ -n "$CF_DIST_ID" ] && [ "$CF_DIST_ID" != "None" ]; then
            echo "Invalidating CloudFront cache: $CF_DIST_ID"
            aws cloudfront create-invalidation --distribution-id $CF_DIST_ID --paths "/*"
          fi
